name: Update profile dashboard

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/update_id_dashboard.py"
      - ".github/workflows/update-id-dashboard.yml"

concurrency:
  group: update-id-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh profile visitor badge
        run: curl --fail --silent --show-error --location "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}&label=Profile%20views&color=22d3ee&style=for-the-badge" --output assets/profile-views.svg

      - name: Fetch GitHub data and update dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python tools/update_id_dashboard.py

      - name: Commit and push changed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dashboard.svg assets/profile-views.svg README.md
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
          else
            git commit -m "Update live GitHub dashboard data"
            git push origin HEAD:main
          fi
