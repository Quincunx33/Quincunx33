name: Update profile dashboard

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/update_id_dashboard.py"
      - "tests/**"
      - ".github/workflows/update-id-dashboard.yml"

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Run updater unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch GitHub data and update dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python tools/update_id_dashboard.py

      - name: Commit and push changed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dashboard.svg hero.svg tasfiya-banner.svg tasfiya-banner-light.svg tasfiya-stats.svg tasfiya-trophies.svg tasfiya-langs.svg tasfiya-lanyard.svg assets/public-project-atlas.svg README.md
          if git diff --cached --quiet; then
            echo "Profile assets are already up to date."
            exit 0
          fi

          git commit -m "Update live GitHub profile metrics"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Profile metrics published successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main."
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Could not publish profile metrics after 5 attempts."
          exit 1
