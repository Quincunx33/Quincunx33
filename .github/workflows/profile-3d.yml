name: Generate 3D contribution profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Quincunx33

      - name: Commit generated contribution images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh 3D contribution profile"
          file_pattern: "profile-3d-contrib/**"

      - name: Upload generated profile images
        uses: actions/upload-artifact@v4
        with:
          name: github-profile-3d-contrib
          path: profile-3d-contrib/
          if-no-files-found: ignore
